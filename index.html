<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSSHOP</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site">

        <!-- 상단 헤더 -->
        <header class="header">

            <!-- 사이트 이름 -->
            <div class="logo">
                JSSHOP
            </div>


            <!-- 검색창 -->
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" placeholder="검색">
            </div>

            <!-- 오른쪽 메뉴 -->
            <div class="header-menu">

                <!-- 마이페이지 -->
                <div class="header-item">
                    <div class="person-icon">
                        <img src="icon/user.JPG">
                    </div>

                    <button> 마이페이지</button>
                </div>


                <!-- 장바구니 -->
                <div class="header-item">
                    <div class="cart-icon">🛒</div>

                    <button>장바구니</button>
                </div>

            </div>

        </header>



        <!-- 카테고리 메뉴 -->
        <nav class="category">

            <a href="new_product.html">이달의 트렌드</a>

            <a href="#">단백질 보충제</a>

            <a href="#">보조제</a>

            <a href="#">비타민 </a>

            <a href="#">진행 중인 이벤트</a>

        </nav>



        <!-- 메인 배너 -->
        <main>

            <section class="main-banner">

                <img src="img/background_image.JPG" alt="운동 보조 제품 이벤트 배너">

            </section>

            <!-- 인기 상품 -->
            <section class="best-seller">

                <h2>베스트 셀러</h2>


                <div class="best-product-list">


                    <!-- 상품 1 -->
                    <div class="best-product">

                        <div class="product-image">
                            <img src="img/bestseller1.JPG" alt="임펙트 웨이 프로틴">
                        </div>

                        <div class="product-name">임펙트 웨이 프로틴</div>

                        <div class="product-price">31,900원</div>

                    </div>


                    <!-- 상품 2 -->
                    <div class="best-product">

                        <div class="product-image">
                            <img src="img/bestseller2.JPG" alt="오리진 프리-워크아웃">
                        </div>

                        <div class="product-name">오리진 프리-워크아웃</div>

                        <div class="product-price">59,900원</div>

                    </div>


                    <!-- 상품 3 -->
                    <div class="best-product">

                        <div class="product-image">
                            <img src="img/bestseller3.JPG" alt="임팩트 소이 프로틴" >
                        </div>

                        <div class="product-name"> 임팩트 소이 프로틴</div>

                        <div class="product-price">41,900원</div>

                    </div>


                    <!-- 상품 4 -->
                    <div class="best-product">

                        <div class="product-image">
                            <img
                                src="img/bestseller4.JPG" alt="클리어 웨이 프로틴">
                        </div>

                        <div class="product-name">클리어 웨이 프로틴</div>

                        <div class="product-price">69,900원</div>

                    </div>

                </div>

            </section>

        </main>
        <hr>
         <a href="page_description.html">페이지 설명</a>
    </div>
</body>
</html>
