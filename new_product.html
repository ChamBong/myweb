<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이달의 신상품</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site">

        <!-- 상단 헤더 -->
        <header class="header">

            <!-- 사이트 이름 -->
            <div class="logo">
                JSSHOP
            </div>


            <!-- 검색창 -->
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" placeholder="검색">
            </div>

            <!-- 오른쪽 메뉴 -->
            <div class="header-menu">

                <!-- 마이페이지 -->
                <div class="header-item">
                    <div class="person-icon">
                        <img src="icon/user.JPG">
                    </div>

                    <button> 마이페이지</button>
                </div>


                <!-- 장바구니 -->
                <div class="header-item">
                    <div class="cart-icon">🛒</div>

                    <button>장바구니</button>
                </div>

            </div>

        </header>



        <!-- 제품 목록 -->
        <main class="product-page">

            <!-- 왼쪽 제품 이미지 영역 -->
            <section class="product-gallery">


                <!-- 제품 1 -->
                <div class="gallery-item">

                    <div class="number">1.</div>

                    <div class="gallery-image">
                        <img src="img/new_product1.JPG" alt="테이크핏 맥스">
                    </div>

                </div>


                <!-- 제품 2 -->
                <div class="gallery-item">

                    <div class="number">2.</div>

                    <div class="gallery-image">
                        <img src="img/new_product2.JPG" alt="셀렉스 프로핏 WPI">
                    </div>

                </div>


                <!-- 제품 3 -->
                <div class="gallery-item">

                    <div class="number">3.</div>

                    <div class="gallery-image">
                        <img src="img/new_product3.JPG" alt="크레아틴 제품">
                    </div>

                </div>

            </section>



            <!-- 오른쪽 제품 정보 -->
            <section class="product-info-list">

                <!--  제품 1 -->
                <div class="product-info">

                    <div class="info-name">테이크핏 맥스</div>

                    <div class="info-detail">

                        <div>가격: 32,480원</div>

                        <div>평점: 4.7 / 5</div>

                        <a href="product_detail1.html" class="buy-button">
                            구매하기
                        </a>

                    </div>

                </div>



                <!-- 제품 2 -->
                <div class="product-info">

                    <div class="info-name">셀렉스 프로핏 WPI</div>

                    <div class="info-detail">

                        <div>가격: 60,200원</div>

                        <div>평점: 4.5 / 5</div>

                        <a href="#" class="buy-button">
                            구매하기
                        </a>

                    </div>

                </div>



                <!-- 제품 3 -->
                <div class="product-info">

                    <div class="info-name">매일유업 더단백 드링크</div>

                    <div class="info-detail">

                        <div>가격: 30,900원</div>

                        <div> 평점: 4.8 / 5</div>

                        <a href="#" class="buy-button">
                            구매하기
                        </a>

                    </div>

                </div>

            </section>

        </main>

    </div>
</body>
</html>
