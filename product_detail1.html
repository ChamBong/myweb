<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 상세 정보</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site">

        <!-- 상단 헤더 -->
        <header class="header">

            <!-- 사이트 이름 -->
            <div class="logo">
                JSSHOP
            </div>


            <!-- 검색창 -->
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" placeholder="검색">
            </div>

            <!-- 오른쪽 메뉴 -->
            <div class="header-menu">

                <!-- 마이페이지 -->
                <div class="header-item">
                    <div class="person-icon">
                        <img src="icon/user.JPG">
                    </div>

                    <button> 마이페이지</button>
                </div>


                <!-- 장바구니 -->
                <div class="header-item">
                    <div class="cart-icon">🛒</div>

                    <button>장바구니</button>
                </div>

            </div>

        </header>



        <!-- 제품 상세 정보 -->
        <main class="detail-page">


            <!-- 왼쪽 제품 이미지 -->
            <section class="detail-image">

                <img src="img/product_detail1.JPG" alt="테이크핏 맥스 제품 상세 이미지">

            </section>



            <!-- 오른쪽 제품 정보 -->
            <section class="detail-info">

                <!-- 평점 -->
                <div class="detail-rating">평점: 4.7 / 5</div>


                <!-- 제품명 -->
                <div class="detail-name">테이크핏 맥스</div>


                <!-- 가격 -->
                <div class="detail-price">가격: 32,480원</div>


                <!-- 구매 버튼 -->
                <button class="detail-buy">구매하기</button>

            </section>



            <!-- 제품 설명 -->
            <section class="description">

                <h3>제품설명</h3>

                <p>
                    이 제품은...
                </p>

            </section>



            <!-- 제품 상세 정보 -->
            <section class="detail-information">


                <!-- 주요 효능 -->
                <div class="information-box">

                    <h3>주요 효능</h3>

                    <ul>
                        <li>효능 1</li>
                        <li>효능 2</li>
                    </ul>

                </div>



                <!-- 영양정보 -->
                <div class="information-box">

                    <h3>영양정보</h3>

                    <p>
                        1회 섭취량 당
                    </p>

                    <p>
                        칼로리: ~~
                    </p>

                    <p>
                        탄수화물: ~~
                    </p>

                </div>



                <!-- 성분 -->
                <div class="information-box">

                    <h3>성분</h3>

                    <p>
                        정제수, 분리대두단백,
                        분리유청단백...
                    </p>

                </div>

            </section>

        </main>

    </div>
</body>
</html>
