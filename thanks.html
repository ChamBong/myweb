<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Letter to- 고마워</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="page">


    <header>

        <a href="index.html"
           class="logo">

            Letter to~

        </a>


        <nav>

            <ul>

                <li>
                    <a href="love.html">
                        사랑해
                    </a>
                </li>

                <li>
                    <a href="thanks.html">
                        고마워
                    </a>
                </li>

                <li>
                    <a href="sorry.html">
                        미안해
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <main class="letter-page">


        <!-- 폰트 선택 -->

        <div class="font-select">

            <input type="radio"
                   name="font"
                   id="philosopher"
                   checked>

            <label for="philosopher">
                Philosopher
            </label>


            <input type="radio"
                   name="font"
                   id="nanum-pen-script">

            <label for="nanum-pen-script">
                Nanum Pen Script
            </label>

        </div>



        <!-- 카드 등장 영역 -->

        <div class="reveal-area">


            <div class="reveal-btn">

                여기야!!

            </div>


            <div class="letter-card">


                <div class="letter-image">

                    <img src="images/thanks.jpg"
                         alt="고마운 사람과의 추억">

                </div>


                <h1 class="letter-title">

                    고마워

                </h1>


                <p class="letter-content">

                    힘들 때 옆에 있어줘서<br>

                    아무 말 없이 기다려줘서<br>

                    그리고 언제나 따뜻하게<br>

                    웃어줘서 고마워.

                </p>


            </div>

        </div>


    </main>


</div>

</body>

</html>
