<body>

<div class="page">


    <header>

        <nav>

        <!-- 폰트 선택 -->

        <div class="font-select">

            <input type="radio"
                   name="font"
                   id="philosopher"
                   checked>

            <label for="philosopher">
                Philosopher

            <input type="radio"
                   name="font"
                   id="nanum-pen-script">

        <!-- 카드 등장 -->

        <div class="reveal-area">


            <div class="reveal-btn">

            <div class="letter-card">

                <h1 class="letter-title">

                    미안해

                <p class="letter-content">

                    그때는 미처 하지 못했던 말이 있어.<br>

                    생각할수록 마음에 남아.<br>

            </div>
