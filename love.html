<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Letter to- 사랑해</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="page">


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <a href="index.html"
           class="logo">

            Letter to~

        </a>


        <nav>

            <ul>

                <li>
                    <a href="love.html">
                        사랑해
                    </a>
                </li>

                <li>
                    <a href="thanks.html">
                        고마워
                    </a>
                </li>

                <li>
                    <a href="sorry.html">
                        미안해
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- =========================
         LETTER PAGE
    ========================== -->

    <main class="letter-page">


        <!-- =========================
             FONT SELECT
        ========================== -->

        <div class="font-select">


            <!-- Philosopher -->

            <input type="radio"
                   name="font"
                   id="philosopher"
                   checked>

            <label for="philosopher">

                Philosopher

            </label>


            <!-- Nanum Pen Script -->

            <input type="radio"
                   name="font"
                   id="nanum-pen-script">

            <label for="nanum-pen-script">

                Nanum Pen Script

            </label>


        </div>



        <!-- =========================
             REVEAL AREA
        ========================== -->

        <div class="reveal-area">


            <!-- 여기야 -->

            <div class="reveal-btn">

                여기야!!

            </div>



            <!-- =========================
                 CARD
            ========================== -->

            <div class="letter-card">


                <!-- 이미지 -->

                <div class="letter-image">

                    <img src="images/love.jpg"
                         alt="사랑하는 사람과의 추억">

                </div>


                <!-- 제목 -->

                <h1 class="letter-title">

                    사랑해

                </h1>


                <!-- 내용 -->

                <p class="letter-content">

                    말로 표현하기에는 부족하지만<br>

                    항상 네가 있어서 고마워.<br>

                    함께 웃었던 순간들이<br>

                    내게는 참 소중해.

                </p>


            </div>

        </div>


    </main>


</div>

</body>

</html>
